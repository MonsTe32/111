plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.example.companionmod'

base {
    archivesName = 'companionmod'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
}

neoForge {
    // Якщо є новіша збірка для 1.21.1 — підстав її (21.1.x)
    version = '21.1.172'

    runs {
        client {
            client()
        }
        server {
            server()
            programArguments.add('--nogui')
        }
    }

    mods {
        companionmod {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
